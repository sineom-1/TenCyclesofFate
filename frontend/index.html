<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮生十梦</title>
    <link rel="stylesheet" href="index.css">
    <!-- Add Marked.js library for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- DOMPurify: sanitize rendered HTML to prevent XSS -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
    <!-- Add pako for Gzip decompression -->
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <!-- Add fast-json-patch for incremental state updates -->
    <script src="https://cdn.jsdelivr.net/npm/fast-json-patch@3.1.1/dist/fast-json-patch.min.js"></script>

    <script type="text/javascript">
        (function (c, l, a, r, i, t, y) {
            c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
            t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
            y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
        })(window, document, "clarity", "script", "t8hrcju0wy");
    </script>
</head>

<body>
    <div id="app-container">
        <!-- Decorative Corners -->
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <!-- Login View -->
        <div id="login-view" class="view active">
            <h1>浮生十梦</h1>
            <p>此乃试炼之地，请先完成注册激活或登录。</p>

            <div id="auth-card" class="auth-card">
                <div class="auth-tabs">
                    <button id="tab-register" class="auth-tab active" type="button">注册并激活</button>
                    <button id="tab-login" class="auth-tab" type="button">账号登录</button>
                </div>

                <form id="register-form" class="auth-form">
                    <input id="register-username" type="text" autocomplete="username" placeholder="用户名（3-32位，字母数字_-）" required>
                    <input id="register-password" type="password" autocomplete="new-password" placeholder="密码（至少8位）" required>
                    <input id="register-confirm-password" type="password" autocomplete="new-password" placeholder="确认密码" required>
                    <input id="register-activation-code" type="text" placeholder="激活码" required>
                    <button id="register-submit" class="login-button" type="submit">注册并进入</button>
                </form>

                <form id="login-form-existing" class="auth-form hidden">
                    <input id="login-username" type="text" autocomplete="username" placeholder="用户名" required>
                    <input id="login-password" type="password" autocomplete="current-password" placeholder="密码" required>
                    <button id="login-submit" class="login-button" type="submit">登录进入</button>
                </form>
            </div>

            <p id="login-error" class="error-message"></p>
        </div>

        <!-- Game View -->
        <div id="game-view" class="view">
            <header id="game-header">
                <div class="header-left">
                    <h1>浮生一梦</h1>
                </div>
                <div id="game-status">
                    <div class="status-item">
                        <span class="label">机缘:</span>
                        <span id="opportunities" class="value">10</span>
                    </div>
                    <div class="header-actions">
                        <button id="fullscreen-button" class="header-button" title="全屏模式">⛶</button>
                        <button id="logout-button" class="header-button">离去</button>
                    </div>
                </div>
            </header>

            <aside id="status-panel">
                <div class="panel-title">
                    <span class="ornament"></span>
                    <h2>人物业力</h2>
                    <span class="ornament"></span>
                </div>
                <div id="character-status" class="custom-scrollbar"></div>
            </aside>

            <main id="main-content">
                <div id="narrative-window" class="custom-scrollbar">
                    <!-- Game narrative will be appended here -->
                </div>
            </main>

            <footer id="action-area">
                <div id="action-input-row" class="action-input-row">
                    <div class="input-wrapper">
                        <input type="text" id="action-input" placeholder="汝欲何为..." disabled>
                        <span class="input-decoration"></span>
                    </div>
                    <button id="action-button" disabled><span>定</span></button>
                </div>
                <button id="start-trial-button" class="hidden">开启下一次试炼</button>
            </footer>
        </div>

        <!-- Loading Spinner -->
        <div id="loading-spinner" class="spinner-overlay" style="display: none;">
            <div class="spinner"></div>
        </div>

        <!-- Roll Animation Overlay -->
        <div id="roll-overlay" class="hidden">
            <div id="roll-panel">
                <div class="dice-cup">🎲</div>
                <div id="roll-details">
                    <span id="roll-type"></span>
                    <span id="roll-target"></span>
                </div>
                <div id="roll-result-display" class="hidden">
                    <span id="roll-outcome"></span>
                    <span id="roll-value"></span>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="index.js"></script>
</body>

</html>
